# Builds an installable Android APK on every push to main (or on demand)
# and publishes it as a GitHub Release.
#
# Permanent download link for testers (replace USER/REPO):
#   https://github.com/USER/REPO/releases/latest/download/app-release.apk
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name pregnancy_companion --org com.example
          fi
          # Friendly app name on the home screen
          sed -i 's/android:label="[^"]*"/android:label="Pregnancy Companion"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          body: Install on Android — open this link on the phone and allow "Install unknown apps" when prompted.
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
